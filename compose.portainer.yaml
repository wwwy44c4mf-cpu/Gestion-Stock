# Standalone stack for Portainer + the existing Home Assistant Cloudflared app.
# Deploy from Git; no host bind mount, Docker socket, or published port.
name: ${COMPOSE_PROJECT_NAME:-gestion-stock}
x-log: &log
  driver: local
  options: {max-size: "10m", max-file: "3"}
x-app-build: &app-build {context: ., target: runtime}
x-backup-build: &backup-build {context: ., target: portainer-backup}
x-env: &env
  APP_ENV: prod
  APP_DEBUG: 0
  APP_REQUIRE_HTTPS: 1
  APP_PUBLIC_URL: https://${APP_DOMAIN:?Définir APP_DOMAIN}
  APP_TRUSTED_HOST_PATTERN: '${APP_TRUSTED_HOST_PATTERN:?Définir le motif exact du domaine}'
  APP_TRUSTED_PROXIES: ${CLOUDFLARED_ADDRESS:?Définir IP exacte Cloudflared}
  APP_SECRET_FILE: /run/secrets/app_secret
  DATABASE_PASSWORD_FILE: /run/secrets/db_password
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  DATABASE_NAME: ${POSTGRES_DB:-gestion_stock}
  DATABASE_USER: ${POSTGRES_USER:-gestion_stock}
  MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=false
  MAIL_DELIVERY_ENABLED: ${MAIL_DELIVERY_ENABLED:-0}
  MAILER_DSN_FILE: /run/secrets/mailer_dsn
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.invalid}
  APP_LOG_LEVEL: info
  OPS_QUEUE_MAX_AGE_SECONDS: 300
x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-app:${RELEASE_ID:?Définir RELEASE_ID}
  build: *app-build
  environment: *env
  volumes: ["app_secrets:/run/secrets:ro"]
  networks: [backend, outbound]
  read_only: true
  tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770", "/app/var:uid=10001,gid=10001,mode=0770"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 256m
  cpus: 0.5
  logging: *log

services:
  setup:
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-backup:${RELEASE_ID:?Définir RELEASE_ID}
    build: *backup-build
    user: "0:0"
    entrypoint: [python3, /opt/portainer-setup.py]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-gestion-stock}
      RELEASE_ID: ${RELEASE_ID:?Définir RELEASE_ID}
      DATABASE_RELEASE_ID: ${DATABASE_RELEASE_ID:?Définir DATABASE_RELEASE_ID}
      APP_DOMAIN: ${APP_DOMAIN:?Définir APP_DOMAIN}
      APP_TRUSTED_HOST_PATTERN: '${APP_TRUSTED_HOST_PATTERN:?Définir le motif exact du domaine}'
      CLOUDFLARED_ADDRESS: ${CLOUDFLARED_ADDRESS:?Définir IP exacte Cloudflared}
      CLOUDFLARED_NETWORK: ${CLOUDFLARED_NETWORK:-hassio}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_stock}
      POSTGRES_USER: ${POSTGRES_USER:-gestion_stock}
      MAIL_DELIVERY_ENABLED: ${MAIL_DELIVERY_ENABLED:-0}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.invalid}
    volumes: ["app_secrets:/app-secrets", "db_secrets:/db-secrets", "backup_secrets:/backup-secrets", "deployment:/deployment", "recovery_key:/recovery-key", "schema_state:/schema-state"]
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    logging: *log

  db:
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-db:${DATABASE_RELEASE_ID:?Définir DATABASE_RELEASE_ID}
    build: {context: ., target: portainer-database}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_stock}
      POSTGRES_USER: postgres
      APP_DB_USER: ${POSTGRES_USER:-gestion_stock}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    command: [postgres, -c, log_error_verbosity=terse, -c, log_min_error_statement=panic, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    volumes: ["postgres_data:/var/lib/postgresql", "db_secrets:/run/secrets:ro"]
    networks: [backend]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    depends_on: {setup: {condition: service_completed_successfully}}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1
    logging: *log
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15

  initialize:
    <<: *app
    command: [sh, docker/portainer/initialize-schema.sh]
    volumes: ["app_secrets:/run/secrets:ro", "schema_state:/deployment-state"]
    depends_on: {db: {condition: service_healthy}}
    restart: "no"

  maintenance:
    <<: *app
    command: [sh, -c, exec sleep infinity]
    networks: [backend]
    depends_on: {db: {condition: service_healthy}}

  app:
    <<: *app
    networks: [frontend, backend, outbound]
    depends_on: {initialize: {condition: service_completed_successfully}}
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, php, docker/healthcheck.php, fpm]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-web:${RELEASE_ID:?Définir RELEASE_ID}
    build: {context: ., target: web}
    environment: {APP_DOMAIN: '${APP_DOMAIN:?Définir APP_DOMAIN}'}
    networks:
      frontend: {}
      cloudflared: {aliases: [gstockbl-origin]}
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101,mode=1770"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: {app: {condition: service_healthy}}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 64m
    cpus: 0.25
    logging: *log
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider --header="Host: $${APP_DOMAIN}" http://127.0.0.1:8080/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: [php, bin/console, messenger:consume, notifications, async, --time-limit=3600, --memory-limit=128M, --no-interaction]
    depends_on: {initialize: {condition: service_completed_successfully}}
    healthcheck: &worker-health
      test: [CMD, php, docker/healthcheck.php, worker]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    <<: *app
    command: [php, bin/console, messenger:consume, scheduler_default, --time-limit=3600, --memory-limit=128M, --no-interaction]
    depends_on: {initialize: {condition: service_completed_successfully}}
    healthcheck: *worker-health

  backup:
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-backup:${RELEASE_ID:?Définir RELEASE_ID}
    build: *backup-build
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: ${POSTGRES_DB:-gestion_stock}
      DATABASE_USER: ${POSTGRES_USER:-gestion_stock}
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      BACKUP_SOURCE: /source
      BACKUP_ENV_FILE: /deployment/portainer.env
      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_RETENTION_DAYS: 90
      TMPDIR: /work
    volumes: ["backup_secrets:/run/secrets:ro", "backup_data:/backups", "deployment:/deployment:ro"]
    networks: [backend]
    read_only: true
    tmpfs: ["/work:uid=10001,gid=10001,mode=0700,size=256m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: {initialize: {condition: service_completed_successfully}}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 0.5
    logging: *log
    healthcheck:
      test: [CMD, python3, /opt/backup.py, health]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 120s

networks:
  backend: {internal: true}
  frontend: {internal: true}
  outbound: {}
  cloudflared:
    external: true
    name: ${CLOUDFLARED_NETWORK:-hassio}
volumes:
  app_secrets: {}
  db_secrets: {}
  backup_secrets: {}
  recovery_key: {}
  deployment: {}
  schema_state: {}
  postgres_data: {}
  backup_data: {}
