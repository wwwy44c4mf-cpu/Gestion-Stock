framework:
  secret: '%env(trim:file:APP_SECRET_FILE)%'
  default_locale: fr
  router:
    utf8: true
  php_errors:
    log: true
  handle_all_throwables: true
  csrf_protection: true
  lock: flock
  session:
    name: GESTION_STOCK_SESSION
    cookie_httponly: true
    cookie_samesite: lax
    cookie_secure: auto
    save_path: '%kernel.project_dir%/var/sessions'
  rate_limiter:
    api_sensitive:
      policy: fixed_window
      limit: 5
      interval: '1 minute'
  messenger:
    failure_transport: failed
    transports:
      async:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          queue_name: async
        retry_strategy:
          max_retries: 3
          delay: 1000
          multiplier: 2
      failed:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          queue_name: failed
    routing:
      App\Message\InfrastructureProbe: async

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file
    messenger:
      transports:
        async:
          options:
            queue_name: soc01_test
        failed:
          options:
            queue_name: soc01_test_failed
