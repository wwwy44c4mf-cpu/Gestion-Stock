services:
  _defaults:
    autowire: true
    autoconfigure: true
  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'
      - '../src/Api/ApiProblem.php'
      - '../src/Api/Pagination.php'
      - '../src/Api/DateRange.php'
      - '../src/Security/StockUser.php'
      - '../src/Security/AccessTarget.php'
      - '../src/Security/SqlScope.php'
      - '../src/Security/Permission.php'

  App\Notification\MailDelivery: '@App\Notification\SmtpDelivery'

  logger:
    alias: App\Operations\StructuredLogger
  Psr\Log\LoggerInterface: '@logger'
