name: ${COMPOSE_PROJECT_NAME:-gestion-stock}

x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-app:soc-01
  environment: &app-env
    APP_ENV: ${APP_ENV:-prod}
    APP_DEBUG: ${APP_DEBUG:-0}
    APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
    OPS_QUEUE_MAX_AGE_SECONDS: ${OPS_QUEUE_MAX_AGE_SECONDS:-300}
    APP_REQUIRE_HTTPS: ${APP_REQUIRE_HTTPS:-0}
    APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-}
    APP_TRUSTED_HOST_PATTERN: ${APP_TRUSTED_HOST_PATTERN:-.+}
    APP_SECRET_FILE: /run/secrets/app_secret
    DATABASE_PASSWORD_FILE: /run/secrets/db_password
    DATABASE_HOST: db
    DATABASE_PORT: 5432
    DATABASE_NAME: ${POSTGRES_DB:-gestion_stock}
    DATABASE_USER: ${POSTGRES_USER:-gestion_stock}
    MAIL_DELIVERY_ENABLED: ${MAIL_DELIVERY_ENABLED:-0}
    MAILER_DSN_FILE: /run/secrets/mailer_dsn
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.invalid}
    APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
    MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=false
  secrets:
    - app_secret
    - db_password
    - mailer_dsn
  networks:
    - backend
    - outbound
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=1770
    - /app/var:uid=10001,gid=10001,mode=0770
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    logging: *logging
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-web:soc-01
    build:
      context: .
      target: web
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    networks: [edge, frontend]
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101,mode=1770"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  app:
    logging: *logging
    <<: *app
    build:
      context: .
      target: runtime
    networks: [frontend, backend, outbound]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, docker/healthcheck.php, fpm]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    logging: *logging
    command: [postgres, -c, log_error_verbosity=terse, -c, log_min_error_statement=panic, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-db:soc-01
    build:
      context: .
      target: database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_stock}
      POSTGRES_USER: postgres
      APP_DB_USER: ${POSTGRES_USER:-gestion_stock}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    secrets: [db_password, db_admin_password]
    networks: [backend]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  init:
    logging: *logging
    <<: *app
    command: [php, bin/console, messenger:setup-transports, --no-interaction]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  worker:
    logging: *logging
    <<: *app
    command: [php, bin/console, messenger:consume, notifications, async, --time-limit=3600, --memory-limit=128M, --no-interaction]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck: &worker-health
      test: [CMD, php, docker/healthcheck.php, worker]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    logging: *logging
    <<: *app
    command: [php, bin/console, messenger:consume, scheduler_default, --time-limit=3600, --memory-limit=128M, --no-interaction]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck: *worker-health

  test:
    logging: *logging
    <<: *app
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-test:soc-01
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      <<: *app-env
      APP_ENV: test
    restart: "no"
    depends_on:
      init:
        condition: service_completed_successfully
      contract-test:
        condition: service_completed_successfully

  contract-test:
    logging: *logging
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-contract-test:soc-03
    build:
      context: .
      target: contract-test
    profiles: [test]
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  backup:
    logging: *logging
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-backup:ops-01
    build:
      context: .
      target: backup
    profiles: [backup]
    environment: &backup-env
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-gestion_stock}
      DATABASE_USER: ${POSTGRES_USER:-gestion_stock}
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
      BACKUP_COMMAND_TIMEOUT: ${BACKUP_COMMAND_TIMEOUT:-600}
      BACKUP_MAX_EXPANDED_BYTES: ${BACKUP_MAX_EXPANDED_BYTES:-10737418240}
      TMPDIR: /work
    secrets: [db_password, db_admin_password, app_secret, mailer_dsn, backup_recipient]
    volumes:
      - backup_data:/backups
      - type: bind
        source: .
        target: /source
        read_only: true
    networks: [backend]
    read_only: true
    tmpfs: ["/work:uid=10001,gid=10001,mode=0700,size=${BACKUP_TMPFS_SIZE:-512m}"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, /opt/backup.py, health]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 120s

  backup-keygen:
    logging: *logging
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-backup:ops-01
    build:
      context: .
      target: backup
    profiles: [backup-tools]
    command: [keygen]
    user: "0:0"
    environment:
      TMPDIR: /work
      BACKUP_KEY_UID: ${BACKUP_KEY_UID:-0}
      BACKUP_KEY_GID: ${BACKUP_KEY_GID:-0}
    volumes: ["./.secrets:/keys"]
    network_mode: none
    read_only: true
    tmpfs: ["/work:mode=0700"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, CHOWN]
    security_opt: [no-new-privileges:true]
    restart: "no"

  backup-files:
    logging: *logging
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-backup:ops-01
    profiles: [backup-tools]
    user: "0:0"
    environment:
      TMPDIR: /work
      RESTORE_OUTPUT_UID: ${RESTORE_OUTPUT_UID:-0}
      RESTORE_OUTPUT_GID: ${RESTORE_OUTPUT_GID:-0}
    secrets: [backup_identity]
    volumes:
      - backup_data:/backups
      - ${BACKUP_RECOVERY_DIRECTORY:-./backup-recovery}:/recovery
    network_mode: none
    read_only: true
    tmpfs: ["/work:mode=0700,size=${BACKUP_TMPFS_SIZE:-512m}"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, CHOWN]
    security_opt: [no-new-privileges:true]
    restart: "no"

  backup-restore:
    logging: *logging
    image: ${COMPOSE_PROJECT_NAME:-gestion-stock}-backup:ops-01
    profiles: [backup-tools]
    user: "0:0"
    environment:
      <<: *backup-env
      RESTORE_CONFIRM_DATABASE: ${RESTORE_CONFIRM_DATABASE:-}
    secrets: [db_password, backup_identity]
    volumes: ["backup_data:/backups:ro"]
    networks: [backend]
    read_only: true
    tmpfs: ["/work:mode=0700,size=${BACKUP_TMPFS_SIZE:-512m}"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: "no"

networks:
  edge: {}
  frontend:
    internal: true
  backend:
    internal: true
  outbound: {}

volumes:
  postgres_data: {}
  backup_data: {}

secrets:
  app_secret:
    file: ./.secrets/app_secret
  db_password:
    file: ./.secrets/db_password
  db_admin_password:
    file: ./.secrets/db_admin_password

  mailer_dsn:
    file: ./.secrets/mailer_dsn

  backup_recipient:
    file: ./.secrets/backup_recipient
  backup_identity:
    file: ./.secrets/backup_identity
