pid /tmp/nginx.pid;
# Native runtime errors can repeat request URLs. HTTP failures remain in sanitized access JSON.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $upstream_http_x_request_id $correlation_id {
        default $upstream_http_x_request_id;
        "" $request_id;
    }
    map $status $access_level {
        ~^5 error;
        ~^4 warning;
        default info;
    }
    log_format safe escape=json '{"timestamp":"$time_iso8601","level":"$access_level","event":"http_access","request_id":"$correlation_id","status":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout safe;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /app/public;
        add_header X-Request-Id $correlation_id always;
        client_max_body_size 2m;
        location /assets/ {
            add_header X-Request-Id $correlation_id always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            try_files $uri =404;
        }
        location / { try_files $uri /index.php$is_args$args; }
        location = /index.php {
            include fastcgi_params;
            fastcgi_pass app:9000;
            fastcgi_hide_header X-Request-Id;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param HTTP_PROXY "";
            internal;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}
