date.timezone = UTC
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
opcache.enable = 1
opcache.validate_timestamps = 0
session.save_path = /tmp

; Les traces persistées ne doivent pas inclure les arguments sensibles.
zend.exception_ignore_args = On
